<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Topic Library</title>

    <link rel="stylesheet" href="css/main.css?v=2" />
    <link rel="stylesheet" href="css/library.css?v=2" />

</head>

<body>

    <!-- Saved-topic library -->
     <div class="library-page">
        <div class="library-header">
            <div>
                <h1>📚 Topic Library</h1>
                <p>Every worksheet you save appears here.</p>
            </div>
        </div>

        <div id="app-navigation"></div>

        <!-- Search, category, and sort controls -->
        <div class="library-tools">
            <label for="topic-search">
                Search topics
            </label>

             <label for="category-filter">
                Filter by category
            </label>

            <select id="category-filter">
                <option value="all">All categories</option>
            </select>

            <select id="status-filter">
                <option value="all">
                    All Statuses
                </option>
                <option value="Draft">
                    Draft
                </option>
                <option value="Published">
                    Published
                </option>
            </select>

            <select id = "sort-filter">
                <option value="newest">Newest</option>
                <option value="oldest">Oldest</option>
                <option value="az">A-Z</option>
                <option value="za">Z-A</option>
                <option value="favorites">Favorites First</option>
            </select>

            <input
                id="topic-search"
                type="search"
                placeholder="Search by title or category..."
                autocomplete="off">

        </div>

        <!-- Topic cards are rendered here from localStorage -->
        <div id="topic-grid"></div>
    </div>

    <!-- Dependencies load before the library controller that consumes them -->
     <script src="js/components/navigation.js?v=1"></script>
     <script src="js/services/storage.js?v=3"></script>
     <script src="js/utils/topic-utils.js?v=1"></script>
     <script src="js/library/library-filters.js?v=5"></script>
     <script src="js/library.js?v=7"></script>

</body>

</html>
