<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Daily Trivia</title>

  <link rel="stylesheet" href="css/main.css?v=4" /> 
  <link rel="stylesheet" href="css/worksheet.css?v=4" />
  <link rel="stylesheet" href="css/print.css?v=5" />

</head>
<body>
  <div class="app-shell">
  <div class="workspace">
    <!-- Application controls excluded from the printed worksheet -->
    <header class="app-header no-print">
      <div>
        <p class="app-label">Resident Activity Tool</p>
        <h1>Activity Studio</h1>
      </div>
    </header>

    <div id="app-navigation" class="no-print"></div>

    <section class="topic-selector no-print">
      <label for="topic-select">Choose Topic:</label>
      <select id="topic-select"></select>
      <button id="load-topic" type="button">Load Topic</button>
    </section>

    <!-- Quick-access topic library -->
    <section class="topic-library no-print">

      <div class="library-header">
        <h2>Topic Library</h2>
        <p>Select a topic to load it into the worksheet.</p>
      </div>

      <div id="topic-library" class="library-grid"></div>

    </section>

  </div>

  <div class="worksheet-actions">

    <button id="print-worksheet" type="button" class="primary-button">Print / Save PDF</button>
    <label class="print-option" for="include-answers">
      <input id="include-answers" type="checkbox" checked>Include answer key
    </label>

  </div>
    
  <!-- Printable worksheet content populated by app.js -->
  <main id="printable-worksheet" class="worksheet">
    
    <header class="worksheet-header">
      <p class="label">Trivia Worksheet</p>
      <h1 id="topic-title"></h1>
      <p class="date">
          Date: <span id="topic-date"></span>
      </p>
    </header>

    <section class="info-box">
      <h2>Read-Aloud Information</h2>
      
      <div id="information"></div>

    </section>

    <section class="media-box">

      <h2>Picture or Video</h2>
      <div id="media-content" class="media-content"></div>
    
    </section>

    <section class="questions">
      <h2>Comprehension Questions</h2>

      <ol id="question-list"></ol>
    </section>

    <section id="worksheet-answers" class="answer-key">
      <h2>Answer Key</h2>

      <ol id="answer-list"></ol>
    </section>
  </main>
<!-- Topic data must load before the worksheet rendering logic -->
  <script src="js/components/navigation.js?v=1"></script>
  <script src="js/services/storage.js?v=1"></script>
  <script src="js/data.js?v=2"></script>
  <script src="js/app.js?v=9"></script>
</div>
</body>
</html>
